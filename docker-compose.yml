services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ledgermind
      POSTGRES_USER: ledgermind_app
      POSTGRES_PASSWORD: app_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermind_app -d ledgermind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c \'cat < /dev/null > /dev/tcp/localhost/6333\' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_opt:
      - timeout:1
      - attempts:5
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ledgermind_app:app_dev_pass@postgres:5432/ledgermind
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./docs/raw:/app/docs/raw:ro
      # READ-ONLY, and read-only is the point. golden_dataset/ holds the three
      # q*.json INPUTS and nothing else; :ro means nothing running in this
      # container can write an eval output beside them, which is the failure
      # that once left 79 outputs against 3 inputs and crashed an anchor scan.
      # Needed by scripts/golden_coverage.py, which requires the database and
      # the datasets at the same time — the host has no psycopg2, so it must run
      # in here, and without this mount /app/golden_dataset does not exist.
      - ./golden_dataset:/app/golden_dataset:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/.next
    command: pnpm dev

  worker:
    build: ./backend
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ledgermind_app:app_dev_pass@postgres:5432/ledgermind
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./docs/raw:/app/docs/raw:ro

  scheduler:
    build: ./backend
    command: celery -A app.worker:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./docs/raw:/app/docs/raw:ro

volumes:
  postgres_data:
  qdrant_data: